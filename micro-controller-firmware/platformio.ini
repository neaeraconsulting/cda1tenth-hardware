; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
framework = arduino
board_build.cpu_freq = 240
monitor_speed = 115200
upload_speed = 115200
lib_deps =
	teemuatlut/TMCStepper@^0.7.0
	https://github.com/sparkfun/SparkFun_Qwiic_6DoF_LSM6DSO_Arduino_Library.git
build_flags =
	-D CONFIG_FREERTOS_HZ=1000
	-D CONFIG_ESP_MAIN_TASK_STACK_SIZE=16384
	-D CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=8192
	-D CONFIG_ESP_TIMER_TASK_STACK_SIZE=8192
lib_ldf_mode = chain+
